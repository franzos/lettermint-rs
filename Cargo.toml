[package]
name = "lettermint"
description = "Lettermint email service client"
license = "MIT OR Apache-2.0"
repository = "https://github.com/franzos/lettermint-rs"
homepage = "https://github.com/franzos/lettermint-rs"
documentation = "https://docs.rs/lettermint"
keywords = ["lettermint", "email", "e-mail", "http"]
categories = ["api-bindings", "email", "web-programming::http-client"]
version = "0.3.2"
edition = "2024"
exclude = ["manifest.scm"]

[dependencies]
bytes = { version = "1.6" }
http = { version = "1.1" }
hmac = { version = "0.13" }
sha2 = { version = "0.11" }
hex = { version = "0.4" }
reqwest012 = { package = "reqwest", version = "0.12", optional = true, default-features = false }
reqwest013 = { package = "reqwest", version = "0.13", optional = true, default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
thiserror = { version = "2.0" }
tracing = { version = "0.1", optional = true }
typed-builder = { version = "0.23" }

[features]
default = []
tracing = ["dep:tracing"]

# reqwest 0.13 (the default backend when the plain `reqwest` feature is enabled).
reqwest = ["reqwest-013"]
reqwest-013 = ["dep:reqwest013"]
reqwest-013-native-tls = ["reqwest-013", "reqwest013/native-tls"]
reqwest-013-rustls = ["reqwest-013", "reqwest013/rustls"]

# Back-compat aliases resolving to the 0.13 backend.
reqwest-native-tls = ["reqwest-013-native-tls"]
reqwest-rustls = ["reqwest-013-rustls"]

# reqwest 0.12 (opt-in). Mutually exclusive with the 0.13 features: enabling
# both is a compile error.
reqwest-012 = ["dep:reqwest012"]
reqwest-012-native-tls = ["reqwest-012", "reqwest012/native-tls"]
reqwest-012-rustls = ["reqwest-012", "reqwest012/rustls-tls"]

[dev-dependencies]
base64 = { version = "0.22" }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
wiremock = { version = "0.6" }
